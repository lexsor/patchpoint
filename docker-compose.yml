services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vuln_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-vuln_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vuln_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vuln_user} -d ${POSTGRES_DB:-vuln_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3001}:3001"
    environment:
      PORT: 3001
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vuln_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-vuln_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vuln_password}
      NVD_API_KEY: ${NVD_API_KEY:-}
      NVD_LOOKBACK_DAYS: ${NVD_LOOKBACK_DAYS:-30}
      NVD_MAX_PAGES: ${NVD_MAX_PAGES:-5}
      MITRE_ENRICH_LIMIT: ${MITRE_ENRICH_LIMIT:-25}
      POLL_INTERVAL_HOURS: ${POLL_INTERVAL_HOURS:-6}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "${CLIENT_PORT:-3000}:80"
    # nginx proxies /api to `server`, so wait for the API to pass its
    # healthcheck rather than merely for the container to be created.
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
