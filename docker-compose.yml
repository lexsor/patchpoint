version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vuln_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-vuln_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vuln_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vuln_user} -d ${POSTGRES_DB:-vuln_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3001}:3001"
    environment:
      PORT: 3001
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vuln_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-vuln_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vuln_password}
      NVD_API_KEY: ${NVD_API_KEY:-}
      POLL_INTERVAL_HOURS: ${POLL_INTERVAL_HOURS:-6}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
