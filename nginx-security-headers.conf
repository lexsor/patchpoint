# Security response headers, in one place.
#
# nginx does NOT merge add_header across levels: a `location` block that
# declares any add_header of its own discards every add_header inherited from
# the enclosing server block. Repeating the list by hand in each location is
# how `location /api/` ended up serving no Content-Security-Policy at all.
#
# Include this from the server block AND from every location that declares an
# add_header, so adding a location cannot silently drop a header.
#
# `always` so they are sent on error responses (4xx/5xx) too, which is where a
# missing header is easiest to overlook.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# Content-Security-Policy.
#
# `script-src` and `style-src` need 'unsafe-inline': index.html carries an
# inline script that applies the stored theme before first paint, and the React
# components set inline style attributes. That is a real weakening, accepted
# because the app has no HTML-injection sink — no dangerouslySetInnerHTML or
# innerHTML anywhere in client/src, and reference URLs from upstream feeds are
# validated to http(s) before ever becoming an href. What the policy still buys
# with 'unsafe-inline' in place is object-src 'none', base-uri 'self',
# frame-ancestors 'none', form-action 'none' and no external script or connect
# hosts — the easy exfiltration channels. Move the theme script to a build-time
# hash if you want to drop 'unsafe-inline' for scripts.
#
# `img-src data:` is required by the emoji favicon, which is a data: SVG.
# `connect-src 'self'` means a split deployment via VITE_API_BASE would be
# blocked; widen it deliberately if you ever serve the API from another origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
