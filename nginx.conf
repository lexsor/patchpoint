server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version.
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # --- Compression --------------------------------------------------------
    # Nothing was compressed before: a list page went out as ~38 KB of JSON
    # (~5.6 KB gzipped) and the JS bundle as ~155 KB (~50 KB gzipped).
    gzip on;
    gzip_vary on;               # so caches key on Accept-Encoding
    gzip_comp_level 6;          # past ~6 the CPU cost outgrows the saving
    gzip_min_length 1024;       # below this the header overhead dominates
    # `any` is required for the /api/ location: without it nginx does not
    # compress responses it received from an upstream.
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        text/javascript
        text/css
        text/plain
        text/xml
        application/xml
        image/svg+xml;

    # --- Static assets ------------------------------------------------------
    # Vite emits content-hashed filenames, so the bytes at a given URL can
    # never change. Cache them permanently; a new build ships a new filename.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html is the one file whose URL is stable while its contents change,
    # so it must always be revalidated — otherwise a client keeps loading the
    # previous build's asset URLs.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Serve static files
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # --- API ----------------------------------------------------------------
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;

        # Vulnerability data changes only when a fetch cycle runs, but a stale
        # page would be confusing right after a manual refresh, so no caching.
        add_header Cache-Control "no-store" always;
    }

    # Health check
    location /health {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://server:3001;
        access_log off;
    }
}
