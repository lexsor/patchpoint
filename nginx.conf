server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version.
    server_tokens off;

    # --- Security headers ---------------------------------------------------
    # `always` so they are still sent on error responses (4xx/5xx), which is
    # where a missing header is easiest to overlook.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # Content-Security-Policy.
    #
    # `script-src` and `style-src` need 'unsafe-inline': index.html carries an
    # inline script that applies the stored theme before first paint, and the
    # React components set inline style attributes. That is a real weakening,
    # accepted here because the app has no HTML-injection sink — no
    # dangerouslySetInnerHTML or innerHTML anywhere in client/src, and
    # reference URLs from upstream feeds are validated to http(s) before ever
    # becoming an href. Tighten it to a hash or nonce if an inline script is
    # ever added that handles untrusted input.
    #
    # `img-src data:` is required by the emoji favicon, which is a data: SVG.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    # --- Compression --------------------------------------------------------
    # Nothing was compressed before: a list page went out as ~38 KB of JSON
    # (~5.6 KB gzipped) and the JS bundle as ~205 KB (~69 KB gzipped).
    gzip on;
    gzip_vary on;               # so caches key on Accept-Encoding
    gzip_comp_level 6;          # past ~6 the CPU cost outgrows the saving
    gzip_min_length 1024;       # below this the header overhead dominates
    # `any` is required for the /api/ location: without it nginx does not
    # compress responses it received from an upstream.
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        text/javascript
        text/css
        text/plain
        text/xml
        application/xml
        image/svg+xml;

    # --- Static assets ------------------------------------------------------
    # Vite emits content-hashed filenames (index-BXcnHrFb.js), so the bytes at
    # a given URL can never change. Cache them permanently; a new build ships
    # a new filename.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html is the one file whose URL is stable while its contents change,
    # so it must always be revalidated — otherwise a client keeps loading the
    # previous build's asset URLs.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    }

    # --- Note on add_header inheritance -------------------------------------
    # nginx does NOT merge add_header across levels: a `location` block that
    # declares any add_header of its own discards every add_header inherited
    # from the server block. The caching locations below therefore repeat the
    # security headers, or assets and index.html would have been served with
    # none of them.

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;

        # Vulnerability data changes only when a fetch cycle runs, but a stale
        # page would be confusing right after a manual refresh, so no caching.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    }

    # Health check
    location /health {
        proxy_pass http://server:3001;
        access_log off;
    }
}
